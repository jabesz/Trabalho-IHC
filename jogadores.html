<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Esports Wiki - Jogadores</title>
    <link rel="stylesheet" href="jogadores-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="riot-header">
        <div class="logo">ESPORTS <b>ARENA</b></div>
        <nav>
            <ul>
                <li><a href="index.html">INÍCIO</a></li>
                <li><a href="jogadores.html" class="active">JOGADORES</a></li>
                <li><a href="comparacao.html">COMPARAÇÃO</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-wrapper">
        <aside class="sidebar">
            <div class="section-title">COUNTER-STRIKE</div>
            <button class="btn-filter" id="btn-lg" onclick="carregarTime('lg')">LUMINOSITY (2016)</button>
            <button class="btn-filter" id="btn-furia" onclick="carregarTime('furia')">FURIA</button>
            <button class="btn-filter" id="btn-astralis" onclick="carregarTime('astralis')">ASTRALIS</button>
            <button class="btn-filter" id="btn-navi" onclick="carregarTime('navi')">NAVI</button>

            <div class="section-title" style="margin-top: 30px;">VALORANT</div>
            <button class="btn-filter" id="btn-loud" onclick="carregarTime('loud')">LOUD</button>
            <button class="btn-filter" id="btn-acend" onclick="carregarTime('acend')">ACEND</button>
            <button class="btn-filter" id="btn-eg" onclick="carregarTime('eg')">EG</button>
            <button class="btn-filter" id="btn-sentinels" onclick="carregarTime('sentinels')">SENTINELS</button>

            <div class="section-title" style="margin-top: 30px;">LEAGUE OF LEGENDS</div>
            <button class="btn-filter" id="btn-pain" onclick="carregarTime('pain')">PAIN GAMING</button>
            <button class="btn-filter" id="btn-t1" onclick="carregarTime('t1')">T1</button>
            <button class="btn-filter" id="btn-ssw" onclick="carregarTime('ssw')">SSW</button>
            <button class="btn-filter" id="btn-edg" onclick="carregarTime('edg')">EDG</button>
        </aside>

        <main class="content">
            <div class="content-header">
                <h1 id="time-selecionado">SELECIONE UM <span>TIME</span></h1>
            </div>
            <div class="players-grid" id="players-grid">
                </div>
        </main>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-card">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <div class="modal-body">
                <div style="flex: 1;">
                    <h2 id="modalPlayerName" style="font-family: 'Oswald'; color: #ff4655;">NOME</h2>
                    <p id="modalPlayerRole" style="color: #888;">Role</p>
                    <div class="stat-box">K/D: <span id="modalKD">0</span></div>
                    <div class="stat-box">HS% / KDA: <span id="modalHS">0</span></div>
                </div>
                <div style="flex: 1; width: 300px;">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="jogadores-script.js"></script>
</body>
</html>
