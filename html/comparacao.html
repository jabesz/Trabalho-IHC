<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação Avançada | Arena Wiki</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/compare.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="riot-header">
        <div class="logo">
            <a class="link-logo" href="index.html">
                ARENA<b>WIKI</b>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">INÍCIO</a></li>
                <li><a href="jogadores.html">JOGADORES</a></li>
                <li><a href="clipes.html">CLIPES</a></li>
                <li><a href="comparacao.html" class="active">COMPARAÇÃO</a></li>
            </ul>
        </nav>
    </header>

    <div class="game-tabs">
        <button id="tab-cs" class="game-tab active" onclick="mudarJogo('cs')">COUNTER-STRIKE 2</button>
        <button id="tab-val" class="game-tab" onclick="mudarJogo('val')">VALORANT</button>
        <button id="tab-lol" class="game-tab" onclick="mudarJogo('lol')">LEAGUE OF LEGENDS</button>
    </div>

    <div class="mode-tabs-container" style="display: flex; justify-content: center; gap: 10px; margin: 15px auto;">
        <button id="mode-player" class="game-tab active" style="padding: 8px 16px; font-size: 14px;" onclick="mudarModo('player')">COMPARAR JOGADORES</button>
        <button id="mode-team" class="game-tab" style="padding: 8px 16px; font-size: 14px;" onclick="mudarModo('team')">COMPARAR TIMES</button>
    </div>

    <div class="compare-container">
        <div class="selectors-row">
            <div class="player-select-box" style="border-top: 4px solid #ff4655;">
                <h2 id="title-side-1">JOGADOR 1</h2>
                <div class="cascade-selects" style="display: flex; flex-direction: column; gap: 10px;">
                    <select id="team1-select" onchange="aoSelecionarTime(1)"></select>
                    <select id="ent1-select" onchange="atualizarComparacao()"></select>
                </div>
            </div>

            <div class="vs-divider">
                <span class="vs-text">VS</span>
            </div>

            <div class="player-select-box" style="border-top: 4px solid #00bfff;">
                <h2 id="title-side-2">JOGADOR 2</h2>
                <div class="cascade-selects" style="display: flex; flex-direction: column; gap: 10px;">
                    <select id="team2-select" onchange="aoSelecionarTime(2)"></select>
                    <select id="ent2-select" onchange="atualizarComparacao()"></select>
                </div>
            </div>
        </div>

        <div class="visual-comparison-grid">
            <div class="chart-box">
                <div class="chart-wrapper">
                    <canvas id="compareChart"></canvas>
                </div>
            </div>
            
            <div class="details-box">
                <div class="details-header">
                    <h3 id="table-details-title">ESTATÍSTICAS DETALHADAS DO ATLETA</h3>
                </div>
                <div class="stats-table" id="statsDetailedContainer"></div>
            </div>
        </div>
    </div>

    <script src="../js/players.js"></script>
    <script src="../js/compare.js"></script>
</body>
</html>
