<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação | Arena Wiki</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/compare.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="riot-header">
        <div class="logo">
            <a class="link-logo" href="index.html">
                ARENA<b>WIKI</b>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">INÍCIO</a></li>
                <li><a href="jogadores.html">JOGADORES</a></li>
                <li><a href="clipes.html">CLIPES</a></li>
                <li><a href="comparacao.html" class="active">COMPARAÇÃO</a></li>
            </ul>
        </nav>
    </header>

    <div class="game-tabs">
        <button class="game-tab active" onclick="mudarJogo('cs')">COUNTER-STRIKE</button>
        <button class="game-tab" onclick="mudarJogo('val')">VALORANT</button>
        <button class="game-tab" onclick="mudarJogo('lol')">LEAGUE OF LEGENDS</button>
    </div>

    <div class="compare-container">
        <div class="selectors-row">
            <div class="player-select-box" style="border-top: 4px solid #ff4655;">
                <h2>JOGADOR 1</h2>
                <select id="p1-select">
                    </select>
            </div>

            <div class="vs-divider">
                <button class="btn-compare" onclick="gerarComparacao()">COMPARAR</button>
            </div>

            <div class="player-select-box" style="border-top: 4px solid #00bfff;">
                <h2>JOGADOR 2</h2>
                <select id="p2-select">
                    </select>
            </div>
        </div>

        <div class="chart-wrapper">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
